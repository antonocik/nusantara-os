# NusantaraOS grub.cfg (UEFI)
set timeout=5
set default=0
insmod part_gpt
insmod fat
insmod search_fs_uuid
insmod linux
insmod initrd2

menuentry "NusantaraOS Live & Install" --class gnu-linux {
  linux /boot/x86_64/vmlinuz-linux-zen archisobasedir=arch archisolabel=NUSANTARAOS_2026 quiet splash
  initrd /boot/x86_64/initramfs-linux-zen.img
}
menuentry "NusantaraOS Safe Mode" {
  linux /boot/x86_64/vmlinuz-linux-zen archisobasedir=arch archisolabel=NUSANTARAOS_2026
  initrd /boot/x86_64/initramfs-linux-zen.img
}
