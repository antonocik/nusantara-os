# Nusantara OS — GRUB (dipakai bila bootmode grub diaktifkan)
set timeout=5
set default=0
insmod part_gpt
insmod fat
insmod search_fs_uuid
insmod linux
insmod initrd

menuentry "Nusantara OS (x86_64) - Live & Install" --class gnu-linux {
  linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=2G quiet splash
  initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
}

menuentry "Nusantara OS - Safe Mode" {
  linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset
  initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
}
