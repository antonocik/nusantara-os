name: build-iso

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil desktop"
        required: true
        default: kde
        type: choice
        options: [kde, xfce, gnome, sway]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  iso:
    name: Build ISO (${{ github.event.inputs.profile || 'kde' }})
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Ruang disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /

      - name: Build di container Arch Linux
        env:
          PROFILE: ${{ github.event.inputs.profile || 'kde' }}
        run: |
          docker run --rm --privileged \
            -v "$PWD":/build -w /build \
            -e PROFILE="$PROFILE" \
            archlinux:latest bash -lc '
              set -euo pipefail
              echo "::group::Sinkron repo Arch"
              pacman -Syu --noconfirm --needed archlinux-keyring
              pacman -S --noconfirm --needed archiso squashfs-tools base-devel git zstd
              echo "::endgroup::"
              echo "::group::mkarchiso"
              ./build.sh "$PROFILE"
              echo "::endgroup::"
            '

      - name: Checksum & ukuran
        run: |
          ls -lh out/
          sha256sum out/*.iso | tee out/SHA256SUMS

      - name: Simpan artefak
        uses: actions/upload-artifact@v4
        with:
          name: NusantaraOS-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          retention-days: 14
          compression-level: 0

      - name: Lampirkan ke release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/SHA256SUMS
