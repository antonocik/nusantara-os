name: build-iso

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil desktop"
        required: true
        default: kde
        type: choice
        options: [kde, xfce, gnome, sway]
      calamares:
        description: "Bangun Calamares dari AUR (installer grafis)"
        required: true
        default: "1"
        type: choice
        options: ["1", "0"]
      chaotic:
        description: "Aktifkan Chaotic-AUR (repo ala Garuda)"
        required: true
        default: "0"
        type: choice
        options: ["0", "1"]
  release:
    types: [published]

permissions:
  contents: write

env:
  PROFILE: ${{ github.event.inputs.profile || 'kde' }}
  WITH_CALAMARES: ${{ github.event.inputs.calamares || '1' }}
  WITH_CHAOTIC: ${{ github.event.inputs.chaotic || '0' }}

jobs:
  iso:
    name: Build ISO (${{ github.event.inputs.profile || 'kde' }})
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Ruang disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h /

      - name: Build di container Arch Linux
        run: |
          docker run --rm --privileged \
            -v "$PWD":/build -w /build \
            -e PROFILE="$PROFILE" \
            -e WITH_CALAMARES="$WITH_CALAMARES" \
            -e WITH_CHAOTIC="$WITH_CHAOTIC" \
            archlinux:latest bash -lc '
              set -euo pipefail
              echo "::group::Sinkron repo Arch"
              pacman -Syu --noconfirm --needed archlinux-keyring
              pacman -S --noconfirm --needed \
                archiso squashfs-tools libisoburn mtools dosfstools \
                base-devel git zstd curl
              echo "::endgroup::"
              echo "::group::build.sh $PROFILE"
              ./build.sh "$PROFILE"
              echo "::endgroup::"

              echo "::group::Verifikasi isi ISO"
              ISO="$(ls out/*.iso | head -n1)"
              echo "ISO: $ISO ($(du -h "$ISO" | cut -f1))"
              xorriso -indev "$ISO" -find /arch/x86_64 -type f -exec lsdl
              xorriso -indev "$ISO" -find /arch/boot/x86_64 -type f -exec lsdl
              xorriso -indev "$ISO" -find /arch/boot/syslinux -type f -exec lsdl
              echo "::endgroup::"

              echo "::group::Verifikasi rootfs live"
              xorriso -osirrox on -indev "$ISO" \
                -extract /arch/x86_64/airootfs.sfs /tmp/airootfs.sfs
              unsquashfs -l /tmp/airootfs.sfs > /tmp/sfs.txt
              for f in \
                etc/calamares/settings.conf \
                etc/calamares/branding/nusantara/branding.desc \
                etc/calamares/modules/shellprocess.conf \
                etc/calamares/modules/unpackfs.conf \
                etc/mkinitcpio.conf.d/archiso.conf \
                etc/sddm.conf.d/99-nusantara-autologin.conf \
                etc/sysusers.d/nusantara-live.conf \
                etc/sudoers.d/99-nusantara-live \
                etc/systemd/system/multi-user.target.wants/sddm.service \
                usr/bin/calamares \
                usr/bin/sddm \
                usr/local/bin/nusantara-install \
                usr/share/sddm/themes/nusantara/Main.qml \
                home/nusantara/Desktop/nusantara-install.desktop ; do
                grep -qx "squashfs-root/$f" /tmp/sfs.txt || { echo "HILANG: $f"; exit 1; }
              done
              echo "semua file kunci ada di rootfs live"
              rm -f /tmp/airootfs.sfs /tmp/sfs.txt
              echo "::endgroup::"
            '

      - name: Checksum & ukuran
        run: |
          sudo chown -R "$USER":"$USER" out
          ls -lh out/
          ( cd out && sha256sum ./*.iso | tee SHA256SUMS )

      - name: Simpan artefak
        uses: actions/upload-artifact@v4
        with:
          name: NusantaraOS-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          retention-days: 14
          compression-level: 0

      - name: Lampirkan ke release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/SHA256SUMS
