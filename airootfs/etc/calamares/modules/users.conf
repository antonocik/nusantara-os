---
# User baru otomatis masuk grup penting (sudo, audio, gaming, printer).
defaultGroups:
  - wheel
  - audio
  - video
  - network
  - storage
  - lp
  - scanner
  - power
  - users

autologinGroup: autologin
doAutologin: false
displayAutologin: false

sudoersGroup: wheel
sudoersConfigureWithGroup: false
setRootPassword: false
doReusePassword: false
allowWeakPasswords: false

user:
  shell: /bin/bash
  home_permissions: "o700"
  forbidden_names: [ root ]

hostname:
  location: EtcFile
  writeHostsFile: true
  forbidden_names: [ localhost ]
