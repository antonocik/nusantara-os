---
# Bersihkan sisa konfigurasi live, lalu bangun initramfs sistem hasil install.
# Dijalankan di chroot target (dontChroot: false).
dontChroot: false
timeout: 1800
verbose: true

i18n:
  name: "Menyiapkan Nusantara OS"

script:
  # rootfs live memakai hook archiso — jangan sampai ikut ke sistem terpasang
  - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"

  # konfigurasi khusus live session
  - "rm -f /etc/sudoers.d/99-nusantara-live"
  - "rm -f /etc/sysusers.d/nusantara-live.conf"
  - "rm -f /etc/tmpfiles.d/nusantara-live.conf"
  - "rm -f /etc/sddm.conf.d/99-nusantara-autologin.conf"
  - "rm -f /usr/local/bin/nusantara-install"

  # hapus user live; -f karena proses sesi live masih berjalan saat install
  - "-userdel -f nusantara"
  - "-rm -rf /home/nusantara"

  # locale: pastikan minimal en_US.UTF-8 tersedia, lalu kompilasi
  - "grep -q '^en_US.UTF-8 UTF-8' /etc/locale.gen || echo 'en_US.UTF-8 UTF-8' >> /etc/locale.gen"
  - "-locale-gen"

  # initramfs untuk kernel linux-zen (preset dari paket kernel)
  - command: "mkinitcpio -P"
    timeout: 900

  # snapper: konfigurasi snapshot pada subvolume @snapshots
  - "-snapper -c root create-config /"
  - "-snapper -c root set-config TIMELINE_LIMIT_HOURLY=5"
  - "-snapper -c root set-config TIMELINE_LIMIT_DAILY=7"
  - "-snapper -c root set-config TIMELINE_LIMIT_WEEKLY=4"
  - "-snapper -c root set-config TIMELINE_LIMIT_MONTHLY=2"
  - "-snapper -c root set-config TIMELINE_LIMIT_YEARLY=0"

  # pastikan GRUB mendeteksi snapshot BTRFS
  - "grub-mkconfig -o /boot/grub/grub.cfg"
