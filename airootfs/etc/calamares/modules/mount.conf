---
# Subvolume BTRFS ala Garuda OS.
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /.snapshots
    subvolume: /@snapshots
  - mountPoint: /var/log
    subvolume: /@var_log
  - mountPoint: /var/cache
    subvolume: /@var_cache

# Tidak ada mount tambahan di luar partisi utama.
extraMounts: []
