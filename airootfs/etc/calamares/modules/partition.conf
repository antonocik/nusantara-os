---
# NusantaraOS partition.conf — BTRFS + Snapper seperti Garuda OS
efiSystemPartition:
  size: 512MiB
  type: fat32
  mountPoint: /boot/efi
  label: EFI

bootPartition:
  size: 1GiB
  type: btrfs
  mountPoint: /boot
  label: BOOT

# root dan home menyatu di BTRFS subvolume
# Calamares akan buat @, @home, @snapshots, @var_log
btrfsSubvolumes:
  - mountPoint: /
    subvolume: "@"
  - mountPoint: /home
    subvolume: "@home"
  - mountPoint: /.snapshots
    subvolume: "@snapshots"
  - mountPoint: /var/log
    subvolume: "@var_log"
  - mountPoint: /var/cache
    subvolume: "@var_cache"

# swap: pakai zram + swapfile (garuda-style)
swap:
  type: partition
  size: 2GiB
  label: SWAP

lvm:
  luks:
    enable: false

# default layout: btrfs
# user bisa ubah manual di Calamares
