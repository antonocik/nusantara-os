---
# Nusantara OS - aktifkan SDDM/Plymouth/GRUB merah setelah install
shell_process:
  - command: plymouth-set-default-theme -R nusantara
    timeout: 30
  - command: grub-mkconfig -o /boot/grub/grub.cfg
    timeout: 30
  - command: cp -a /usr/share/plymouth/themes/nusantara /usr/share/plymouth/themes/nusantara
    timeout: 20
  - command: chmod 755 /usr/share/sddm/themes/nusantara/* /usr/share/plymouth/themes/nusantara/*
    timeout: 10
  - command: echo "Nusantara OS theme applied"
    timeout: 10
