---
# Nusantara OS — Calamares 3.3
# Urutan installer: welcome → partisi → user → install.

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary

  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localtime
      - hwclock
      - users
      - displaymanager
      - networkcfg
      - services-systemd
      - grubcfg
      - bootloader
      - plymouthcfg
      - initramfs
      - umount

  - quit:
      - finished

# Jangan biarkan user melewati partisi
disable-cancel: false
disable-cancel-during-exec: true
