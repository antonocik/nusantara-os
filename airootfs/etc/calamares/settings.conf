---
# Nusantara OS — Calamares 3.4
# Urutan modul mengikuti contoh resmi Calamares 3.4
# (locale menangani timezone, localecfg menulis locale.gen/locale.conf).

modules-search: [ local ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary

  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - locale
      - keyboard
      - localecfg
      - fstab
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - plymouthcfg
      - shellprocess
      - grubcfg
      - bootloader
      - umount

  - show:
      - finished

branding: nusantara
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
