---
# NusantaraOS Calamares settings.conf — urutan modul installer
instances:
  - sequence:
      - show: all
      - exec: all
      - quit: all

sequence:
  show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary

  exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localtime
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - grubcfg
    - copyfiles
    - umount

  quit:
    - finished
    - boot
