# Nusantara OS — initramfs live (archiso)
# Drop-in ini hanya untuk ISO live. Calamares menghapusnya saat install
# (lihat modules/shellprocess.conf) supaya sistem terpasang tidak memakai
# hook archiso.
HOOKS=(base udev plymouth microcode modconf kms memdisk archiso block filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-15)
