# NusantaraOS - pacman.conf (Arch + Chaotic-AUR seperti Garuda)
[options]
HoldPkg = pacman glibc
#Color
Color = auto

# cache bersih otomatis
CleanMethod = KeepInstalled

ParallelDownloads = 5
SigLevel = PackageRequired

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Garuda uses Chaotic-AUR — kunci sudah termasuk; uncomment jika gagal sync
[chaotic-aur]
SigLevel = PackageRequired
Include = /etc/pacman.d/chaotic-mirrorlist

# [nusantara]
# Server = https://repo.nusantaraos.org/$repo/os/$arch
