# Nusantara OS — syslinux (BIOS)
DEFAULT nusantara
PROMPT 0
TIMEOUT 80
ONTIMEOUT nusantara

LABEL nusantara
  MENU LABEL Nusantara OS (x86_64, BIOS) - Live & Install
  LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=1G quiet

LABEL nusantara-safe
  MENU LABEL Nusantara OS - Safe Mode (tanpa KMS)
  LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset
