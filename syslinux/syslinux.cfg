-- NusantaraOS syslinux.cfg (BIOS)
DEFAULT nusantara
PROMPT 0
TIMEOUT 50
ONTIMEOUT nusantara

LABEL nusantara
  MENU LABEL NusantaraOS GNU/Linux - Live & Install
  LINUX /boot/x86_64/vmlinuz-linux-zen
  INITRD /boot/x86_64/initramfs-linux-zen.img
  APPEND archisobasedir=arch archisolabel=NUSANTARAOS_2026 archiso_nbd_srv=${archiso_nbd_srv} cow_spacesize=1G quiet splash

LABEL nusantara-safemode
  MENU LABEL NusantaraOS Safe Mode (tanpa Plymouth)
  LINUX /boot/x86_64/vmlinuz-linux-zen
  INITRD /boot/x86_64/initramfs-linux-zen.img
  APPEND archisobasedir=arch archisolabel=NUSANTARAOS_2026 cow_spacesize=1G

LABEL memtest
  MENU LABEL Memtest86+
  LINUX /boot/memtest86+/memtest.bin
